name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path apps/api/Cargo.toml
      - name: Temporary formatted output for review
        run: |
          echo '===FORMATTED_MAIN_START==='
          cat apps/api/src/main.rs
          echo '===FORMATTED_MAIN_END==='
          echo '===FORMATTED_REQUESTS_START==='
          cat apps/api/src/requests.rs
          echo '===FORMATTED_REQUESTS_END==='
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/api/Cargo.toml
